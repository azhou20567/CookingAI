{% extends "recipes/base.html" %}

{% block title %}{{ heading }} - CookingAI{% endblock %}

{% block head_extra %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block body %}
    <div class="container mt-5">
        <a href="{% url 'home' %}" class="btn btn-secondary mb-3">Home</a>
        <div class="alert alert-warning">
            <h1 class="h4">{{ heading }}</h1>
            <p class="mb-0">{{ detail }}</p>
        </div>
        {% if cause %}
            <details class="text-muted">
                <summary>Technical details</summary>
                <pre class="mt-2">{{ cause }}</pre>
            </details>
        {% endif %}
        <a href="{% url 'youtube_form' %}" class="btn btn-primary mt-3">Try another video</a>
    </div>
{% endblock %}
